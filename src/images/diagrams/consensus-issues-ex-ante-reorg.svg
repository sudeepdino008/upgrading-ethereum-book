<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="'Gloria Hallelujah', cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Gloria+Hallelujah:wght@400;500');</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>

  <!-- slot labels -->
  <text x="110" y="30" text-anchor="middle" font-size="14">slot n</text>
  <text x="300" y="30" text-anchor="middle" font-size="14">slot n+1</text>
  <text x="520" y="30" text-anchor="middle" font-size="14">slot n+2</text>

  <!-- block n (honest, on chain) -->
  <rect x="60" y="120" width="100" height="56" rx="8" fill="none" stroke="black" stroke-width="2"/>
  <text x="110" y="153" text-anchor="middle" font-size="15">block n</text>

  <!-- adversary withheld block n+1 (dashed, top) -->
  <rect x="250" y="60" width="100" height="56" rx="8" fill="none" stroke="black" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="300" y="84" text-anchor="middle" font-size="13">block n+1</text>
  <text x="300" y="104" text-anchor="middle" font-size="11">(withheld)</text>

  <!-- honest block n+2 (bottom, built on n) -->
  <rect x="470" y="180" width="100" height="56" rx="8" fill="none" stroke="black" stroke-width="2"/>
  <text x="520" y="204" text-anchor="middle" font-size="13">block n+2</text>
  <text x="520" y="224" text-anchor="middle" font-size="11">(honest)</text>

  <!-- parent links -->
  <line x1="250" y1="96" x2="160" y2="140" stroke="black" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="470" y1="204" x2="160" y2="160" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- withheld attestations stack on n+1 -->
  <text x="300" y="140" text-anchor="middle" font-size="11">+ withheld votes</text>

  <!-- release annotation -->
  <line x1="350" y1="88" x2="470" y2="195" stroke="black" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="350" y="285" text-anchor="middle" font-size="12">at slot n+2 the adversary releases the hoard;</text>
  <text x="350" y="303" text-anchor="middle" font-size="12">its branch outweighs the honest block, which is orphaned</text>
</svg>
