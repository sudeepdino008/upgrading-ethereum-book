<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" font-family="Gloria Hallelujah, cursive">
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Gloria+Hallelujah:wght@400;500');text{font-family:'Gloria Hallelujah',cursive;}</style>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="black"/></marker>
</defs>
<rect x="30" y="80" width="160" height="70" rx="8" fill="none" stroke="black" stroke-width="2"/>
<text x="110" y="110" text-anchor="middle" font-size="15">Validator</text>
<text x="110" y="132" text-anchor="middle" font-size="15">client</text>
<text x="110" y="170" text-anchor="middle" font-size="11">holds keys</text>
<rect x="270" y="80" width="160" height="70" rx="8" fill="none" stroke="black" stroke-width="2"/>
<text x="350" y="110" text-anchor="middle" font-size="15">Beacon node</text>
<text x="350" y="132" text-anchor="middle" font-size="13">(consensus)</text>
<text x="350" y="170" text-anchor="middle" font-size="11">runs fork choice</text>
<rect x="510" y="80" width="160" height="70" rx="8" fill="none" stroke="black" stroke-width="2"/>
<text x="590" y="110" text-anchor="middle" font-size="15">Execution</text>
<text x="590" y="132" text-anchor="middle" font-size="15">client</text>
<text x="590" y="170" text-anchor="middle" font-size="11">runs the EVM</text>
<line x1="190" y1="115" x2="262" y2="115" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<line x1="270" y1="100" x2="198" y2="100" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<text x="230" y="75" text-anchor="middle" font-size="11">Beacon API</text>
<line x1="430" y1="115" x2="502" y2="115" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<line x1="510" y1="100" x2="438" y2="100" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<text x="470" y="75" text-anchor="middle" font-size="11">Engine API</text>
<text x="350" y="30" text-anchor="middle" font-size="14">A full staking node</text>
<line x1="350" y1="150" x2="350" y2="205" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<text x="350" y="222" text-anchor="middle" font-size="11">peer-to-peer network</text>
</svg>