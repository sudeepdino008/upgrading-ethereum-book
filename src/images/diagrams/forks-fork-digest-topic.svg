<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" font-family="Gloria Hallelujah, cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Gloria+Hallelujah:wght@400;500');</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>

  <!-- full topic string -->
  <text x="350" y="40" text-anchor="middle" font-size="20" font-family="monospace">/eth2/6a95a1a9/beacon_block/ssz_snappy</text>

  <!-- bracket lines down to boxes -->
  <line x1="55"  y1="55" x2="55"  y2="95" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="55" x2="170" y2="95" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="55" x2="345" y2="95" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="55" x2="560" y2="95" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- prefix -->
  <rect x="10" y="100" width="90" height="55" rx="8" fill="none" stroke="black" stroke-width="2"/>
  <text x="55" y="125" text-anchor="middle" font-size="13">prefix</text>
  <text x="55" y="145" text-anchor="middle" font-size="11">(fixed)</text>

  <!-- fork digest -->
  <rect x="110" y="100" width="120" height="55" rx="8" fill="none" stroke="black" stroke-width="2"/>
  <text x="170" y="125" text-anchor="middle" font-size="13">fork digest</text>
  <text x="170" y="145" text-anchor="middle" font-size="11">4 bytes hex</text>

  <!-- topic name -->
  <rect x="240" y="100" width="210" height="55" rx="8" fill="none" stroke="black" stroke-width="2"/>
  <text x="345" y="125" text-anchor="middle" font-size="13">topic name</text>
  <text x="345" y="145" text-anchor="middle" font-size="11">e.g. beacon_block</text>

  <!-- encoding -->
  <rect x="460" y="100" width="200" height="55" rx="8" fill="none" stroke="black" stroke-width="2"/>
  <text x="560" y="125" text-anchor="middle" font-size="13">encoding</text>
  <text x="560" y="145" text-anchor="middle" font-size="11">ssz_snappy</text>
</svg>
